<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirme sua presença - Aniversário da Gih 🎉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#ffb6c1,#ff69b4,#b084f5);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}
.container{
  background:rgba(0,0,0,0.25);
  padding:30px 20px;
  border-radius:25px;
  text-align:center;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(255,192,203,0.5);
  max-width:400px;
  width:90%;
  animation:glow 3s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 20px rgba(255,192,203,0.5);}
  to{box-shadow:0 0 40px rgba(255,105,180,0.8);}
}
h1{
  font-size:2em;
  margin-bottom:10px;
  animation:titleGlow 2s infinite alternate;
}
@keyframes titleGlow{
  from{text-shadow:0 0 8px #ff9ce3;}
  to{text-shadow:0 0 20px #ff69b4;}
}
.info{font-size:1em;margin-bottom:8px;}
input{
  width:90%;
  padding:12px;
  margin:15px auto;
  border-radius:15px;
  border:none;
  outline:none;
  font-size:1em;
  text-align:center;
  display:block;
}
button{
  padding:12px 30px;
  border-radius:25px;
  border:none;
  background:linear-gradient(45deg,#ff9ce3,#b084f5);
  color:white;
  font-size:1em;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 20px rgba(255,192,203,0.7);
}
button:hover{transform:scale(1.05);}
.obs{
  margin:15px 0;
  padding:10px 15px;
  background:rgba(255,182,193,0.25);
  border-left:4px solid #ff69b4;
  border-radius:10px;
  font-size:0.95em;
  text-align:left;
}
.loader{
  display:none;
  border:4px solid rgba(255,255,255,0.3);
  border-top:4px solid #fff;
  border-radius:50%;
  width:30px;
  height:30px;
  animation:spin 1s linear infinite;
  margin:10px auto;
}
@keyframes spin{to{transform:rotate(360deg);}}
.msg{margin-top:15px;font-size:1.1em;font-weight:bold;min-height:30px;}
@media(max-width:500px){
  h1{font-size:1.6em;}
  .container{padding:25px 15px;}
}
</style>
</head>
<body>
  <div class="container">
    <h1>🎀 Você vai ? 🎀</h1>
    <p class="info">📅 Data: Amanhã (19/10/2025)</p>
    <p class="info">⏰ Horário: 13h</p>
    <p class="info">🍽 Almoço: 15h</p>

    <form id="form" action="https://formspree.io/f/xldpveko" method="POST">
      <input type="text" name="nome" id="nome" placeholder="Digite seu nome..." required>
      <div class="obs">
        <strong>OBS:</strong> Leve toalha, protetor solar e roupa de banho para curtir a piscina! 🏖️
      </div>
      <button type="submit">Confirmar Presença</button>
      <div class="loader" id="loader"></div>
      <p class="msg" id="msg"></p>
    </form>
  </div>

<script>
const form = document.getElementById('form');
const loader = document.getElementById('loader');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  loader.style.display='block';
  msg.textContent='';
  
  const formData = new FormData(form);
  const response = await fetch(form.action, {
    method: 'POST',
    body: formData,
    headers: { 'Accept': 'application/json' }
  });

  loader.style.display='none';
  if(response.ok){
    msg.textContent = '🎉 Presença confirmada! Obrigado 💖';
    form.reset();
  }else{
    msg.textContent = '❌ Erro ao enviar. Tente novamente.';
  }
});
</script>
</body>
</html>
