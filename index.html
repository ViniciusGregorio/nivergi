<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirme sua presença - Aniversário da Gih</title>
<style>
body { margin:0; padding:0; font-family:'Poppins',sans-serif; background: radial-gradient(circle at top,#ffb6c1,#ff69b4,#b084f5); overflow:hidden; display:flex; justify-content:center; align-items:center; min-height:100vh; color:#fff; }
.container { position: relative; z-index: 10; background: rgba(0,0,0,0.2); padding:25px 20px; border-radius:20px; text-align:center; max-width:400px; width:90%; }
h1 { font-size:1.9em; margin-bottom:10px; }
.info { font-size:1em; margin-bottom:10px; }
input { width:100%; padding:12px; margin:10px 0; border-radius:12px; border:none; outline:none; font-size:1em; text-align:center; }
button { padding:12px 25px; border-radius:20px; border:none; background:linear-gradient(45deg,#ff9ce3,#b084f5); color:white; cursor:pointer; transition:0.3s; }
button:hover { transform:scale(1.05); }
.msg { margin-top:15px; font-size:1em; font-weight:bold; min-height:25px; }
.obs { margin:12px 0; padding:8px 12px; background: rgba(255,182,193,0.25); border-left:4px solid #ff69b4; border-radius:10px; font-size:0.95em; text-align:left; }
.container input {
  display: block;
  margin: 10px auto; /* centraliza horizontalmente */
  width: 90%;         /* garante largura proporcional */
  padding: 12px;
  border-radius: 12px;
  border: none;
  outline: none;
  font-size:1em;
  text-align:center;
}

  /* RESPONSIVO */
@media(max-width:500px){ h1{ font-size:1.6em; } input{ padding:10px; font-size:0.95em; } button{ padding:10px 20px; font-size:0.95em; } .container{ padding:20px 15px; } .info{ font-size:0.95em; } }
canvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
  <h1>Você vai ?</h1>
  <p class="info">📅 Data: Amanhã (19/10/2025)</p>
  <p class="info">⏰ Horário: 13h</p>
  <p class="info">🍽 Almoço: 13h</p>
  <input type="text" id="nome" placeholder="Digite seu nome">
  <div class="obs"><strong>OBS:</strong> Não se esqueça de levar toalha e protetor solar para a piscina!</div>
  <button onclick="confirmar()">Confirmar Presença</button>
  <p class="msg" id="msg"></p>
</div>

<script>
// =================== CANVAS CONFETE E PARTICULAS ===================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => { width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; });

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random()*width;
    this.y = Math.random()*height;
    this.vx = (Math.random()-0.5)*1.2;
    this.vy = Math.random()*1+0.5;
    this.size = Math.random()*3+1;
    this.color = `hsl(${Math.random()*360},70%,80%)`;
    this.alpha = Math.random()*0.7+0.3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if(this.y>height){ this.y=0; this.x=Math.random()*width; }
    if(this.x<0){ this.x=width; } if(this.x>width){ this.x=0; }
  }
  draw() {
    ctx.globalAlpha=this.alpha;
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

let particles = [];
for(let i=0;i<30;i++) particles.push(new Particle());

function animate() {
  ctx.clearRect(0,0,width,height);
  for(let p of particles){ p.update(); p.draw(); }
  requestAnimationFrame(animate);
}
animate();

// CONFETE NA CONFIRMAÇÃO
function soltarConfete(){
  let confettiArr = [];
  for(let i=0;i<20;i++){
    confettiArr.push({
      x:Math.random()*width,
      y:0,
      vx:(Math.random()-0.5)*3,
      vy:Math.random()*3+2,
      size:Math.random()*6+3,
      color:`hsl(${Math.random()*360},80%,70%)`
    });
  }
  let t=0;
  function confettiAnimate(){
    ctx.clearRect(0,0,width,height);
    for(let p of particles) p.draw(); // manter partículas
    for(let i=0;i<confettiArr.length;i++){
      let c = confettiArr[i];
      c.x += c.vx; c.y += c.vy;
      ctx.fillStyle=c.color; ctx.globalAlpha=1;
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.size,0,Math.PI*2); ctx.fill();
    }
    t++;
    if(t<60) requestAnimationFrame(confettiAnimate); // ~1s confete
  }
  confettiAnimate();
}

// =================== CONFIRMAR PRESENÇA ===================
function confirmar(){
  const nome = document.getElementById("nome").value.trim();
  const msg = document.getElementById("msg");
  if(!nome){ msg.textContent="Digite seu nome!"; return; }

  soltarConfete(); // confete visual

  // Chamada ao Apps Script via fetch
  fetch("https://script.google.com/macros/s/AKfycbx9D_Sv8rUYnQKPzGSwoAVutu2VgarKVo0JjSdI9KcH8OkEvXLekiTmnI5hq61YIfcv-Q/exec?nome="+encodeURIComponent(nome))
    .then(res => res.text())
    .then(res => {
      msg.textContent = res; // mostra mensagem de sucesso
      document.getElementById("nome").value="";
    })
    .catch(err => {
      msg.textContent = "Erro ao enviar, tente novamente.";
      console.error(err);
    });
}

</script>
</body>
</html>
